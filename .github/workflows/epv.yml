# Runs phpBB's Extension Pre Validator (EPV) on this repository.
# Result: Actions tab > "EPV" > latest run > job log (look for errors / warnings).
name: EPV

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  epv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the extension
        uses: actions/checkout@v4
        with:
          path: ext

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Get EPV
        run: |
          git clone --depth=1 https://github.com/phpbb/epv.git epv
          cd epv
          composer install --no-interaction --no-progress

      - name: Run EPV
        run: php epv/src/EPV.php run --dir="$GITHUB_WORKSPACE/ext" --debug
